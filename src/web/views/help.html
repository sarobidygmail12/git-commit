<main class="mx-auto max-w-page px-4 pt-6 pb-16">
  {{> header}}
  <nav><a class="mr-3.5 text-accent" href="/log">{{web.history}}</a><a class="mr-3.5 text-accent" href="#commandes">{{web.commands}}</a><a class="mr-3.5 text-accent" href="#configuration">{{web.configuration}}</a><a class="mr-3.5 text-accent" href="/config">{{web.editConfig}}</a></nav>
  <p id="error" hidden></p>
  <h2 id="commandes" class="mt-9 mb-3 text-headline">{{web.commands}}</h2>
  <div id="commands"></div>
  <h2 id="configuration" class="mt-9 mb-3 text-headline">{{web.configuration}}</h2>
  <p>{{web.configIntro}}</p>
  <div class="overflow-x-auto">
    <table class="w-full border-collapse bg-panel">
      <thead><tr class="table-cells"><th>{{web.option}}</th><th>{{web.type}}</th><th>{{web.description}}</th></tr></thead>
      <tbody id="options"></tbody>
    </table>
  </div>
  <h2 class="mt-9 mb-3 text-headline">{{web.effectiveConfig}}</h2>
  <pre id="effective" class="overflow-auto rounded-control bg-code p-3 font-mono text-footnote leading-normal"></pre>
</main>
